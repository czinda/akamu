---
# Project: https://codeberg.org/abbra/akamu
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # System packages required to compile akamu and to run JavaScript-based
  # Forgejo Actions (actions/checkout, actions/cache) inside the container.
  #   nodejs22           — required by actions/checkout and actions/cache
  #   openssl-devel      — OpenSSL headers (native-ossl / native-ossl-sys)
  #   clang              — libclang.so + built-in headers (stdarg.h etc.) for bindgen
  #   sqlite-devel       — system SQLite (rusqlite, no bundled feature)
  #   pkgconf-pkg-config — pkg-config used by openssl-sys and rusqlite-sys
  #   gcc / make         — C linker and build tooling
  #   openldap-devel     — libldap + liblber (akamu-ldap FFI)
  #   cyrus-sasl-devel   — libsasl2 (SASL for LDAP GSSAPI bind)
  #   krb5-devel         — libgssapi_krb5 (Kerberos for SASL/GSSAPI)
  DNF_PACKAGES: >-
    nodejs22 gcc make pkgconf-pkg-config openssl-devel clang sqlite-devel
    openldap-devel cyrus-sasl-devel krb5-devel

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  # Compiles the workspace (debug) once and caches the artifacts.
  # All downstream jobs restore from this cache instead of recompiling.
  build:
    name: Build
    runs-on: vdali
    timeout-minutes: 30
    container: quay.io/hummingbird/rust:latest-builder
    steps:
      - name: Install build dependencies
        run: |
          if rpm -q $DNF_PACKAGES >/dev/null 2>&1; then
            echo "All required packages already installed"
          else
            dnf install -y $DNF_PACKAGES
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore cargo registry cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Restore cargo git cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cargo/git
          key: cargo-git-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-git-v1-
      - name: Build workspace
        run: ./contrib/ci/local-ci.sh --no-deps build
      - name: Prune incremental artifacts before caching
        run: rm -rf target/debug/incremental
      - name: Save debug build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
            target/debug/examples
          key: cargo-target-debug-v1-${{ github.sha }}

  # ── Format ─────────────────────────────────────────────────────────────────
  # rustfmt needs no compiled artifacts and no system libraries — runs in
  # parallel with build.
  fmt:
    name: Rustfmt
    runs-on: vdali
    timeout-minutes: 10
    container: quay.io/hummingbird/rust:latest-builder
    steps:
      - name: Install build dependencies
        run: |
          if rpm -q $DNF_PACKAGES >/dev/null 2>&1; then
            echo "All required packages already installed"
          else
            dnf install -y $DNF_PACKAGES
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check formatting
        run: ./contrib/ci/local-ci.sh --no-deps fmt

  # ── Clippy ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    needs: [build]
    runs-on: vdali
    timeout-minutes: 20
    container: quay.io/hummingbird/rust:latest-builder
    steps:
      - name: Install build dependencies
        run: |
          if rpm -q $DNF_PACKAGES >/dev/null 2>&1; then
            echo "All required packages already installed"
          else
            dnf install -y $DNF_PACKAGES
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore cargo registry cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Restore debug build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
            target/debug/examples
          key: cargo-target-debug-v1-${{ github.sha }}
      - name: Run clippy
        run: ./contrib/ci/local-ci.sh --no-deps clippy

  # ── Documentation ──────────────────────────────────────────────────────────
  doc:
    name: Documentation
    needs: [build]
    runs-on: vdali
    timeout-minutes: 20
    container: quay.io/hummingbird/rust:latest-builder
    steps:
      - name: Install build dependencies
        run: |
          if rpm -q $DNF_PACKAGES >/dev/null 2>&1; then
            echo "All required packages already installed"
          else
            dnf install -y $DNF_PACKAGES
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore cargo registry cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Restore debug build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
            target/debug/examples
          key: cargo-target-debug-v1-${{ github.sha }}
      - name: Build documentation
        run: ./contrib/ci/local-ci.sh --no-deps doc

  # ── Test suite ─────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    needs: [build]
    runs-on: vdali
    timeout-minutes: 30
    container: quay.io/hummingbird/rust:latest-builder
    steps:
      - name: Install build dependencies
        run: |
          if rpm -q $DNF_PACKAGES >/dev/null 2>&1; then
            echo "All required packages already installed"
          else
            dnf install -y $DNF_PACKAGES
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore cargo registry cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Restore debug build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
            target/debug/examples
          key: cargo-target-debug-v1-${{ github.sha }}
      - name: Run tests
        run: ./contrib/ci/local-ci.sh --no-deps test

  # ── Benchmarks ─────────────────────────────────────────────────────────────
  # Compile-only: verifies the bench binary stays buildable without the
  # wall-clock cost of running the full issuance benchmark in CI.
  bench:
    name: Benchmarks (compile only)
    needs: [build]
    runs-on: vdali
    timeout-minutes: 20
    container: quay.io/hummingbird/rust:latest-builder
    steps:
      - name: Install build dependencies
        run: |
          if rpm -q $DNF_PACKAGES >/dev/null 2>&1; then
            echo "All required packages already installed"
          else
            dnf install -y $DNF_PACKAGES
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore cargo registry cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Restore debug build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
            target/debug/examples
          key: cargo-target-debug-v1-${{ github.sha }}
      - name: Build benchmarks
        run: ./contrib/ci/local-ci.sh --no-deps bench

  # ── External interop ───────────────────────────────────────────────────────
  # Runs #[ignore]-gated MTC cosigners interop tests that contact external
  # servers (Google, Geomys).  Non-fatal: external server downtime must not
  # block the pipeline.
  interop:
    name: MTC Interop (external)
    needs: [build]
    runs-on: vdali
    timeout-minutes: 10
    continue-on-error: true
    container: quay.io/hummingbird/rust:latest-builder
    steps:
      - name: Install build dependencies
        run: |
          if rpm -q $DNF_PACKAGES >/dev/null 2>&1; then
            echo "All required packages already installed"
          else
            dnf install -y $DNF_PACKAGES
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore cargo registry cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Restore debug build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
            target/debug/examples
          key: cargo-target-debug-v1-${{ github.sha }}
      - name: Run external cosigners interop tests
        run: ./contrib/ci/local-ci.sh --no-deps interop:akamu

  # ── Container image build + security scan ──────────────────────────────────
  # Builds the hardened OCI images, scans for CVEs, generates an SBOM, and
  # signs the image with cosign (Sigstore).  Runs after the test suite passes.
  container-scan:
    name: Container Security Scan
    needs: [test]
    runs-on: vdali
    container: quay.io/hummingbird/rust:latest-builder
    steps:
      - name: Install container and scanning tools
        run: |
          dnf install -y podman skopeo jq
          # Install trivy (CVE scanner)
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          # Install syft (SBOM generator)
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          # Install cosign (image signing)
          curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build hardened server image
        run: |
          podman build \
            --tag akamu:ci-${{ github.sha }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -f Containerfile .

      - name: Build hardened cosigner image
        run: |
          podman build \
            --tag akamu-cosigner:ci-${{ github.sha }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f contrib/containers/Containerfile.cosigner .

      - name: Verify non-root user
        run: |
          USER=$(podman inspect akamu:ci-${{ github.sha }} | jq -r '.[0].Config.User')
          if [ "$USER" != "1001" ] && [ "$USER" != "akamu" ]; then
            echo "FAIL: image runs as '$USER', expected non-root (1001)"
            exit 1
          fi
          echo "PASS: image runs as user '$USER'"

      - name: Verify no build tools in runtime image
        run: |
          FAIL=0
          for tool in cargo rustc gcc clang git make; do
            if podman run --rm akamu:ci-${{ github.sha }} which $tool 2>/dev/null; then
              echo "FAIL: build tool '$tool' found in runtime image"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "PASS: no build tools in runtime image"

      - name: Verify no SUID/SGID binaries
        run: |
          SUID=$(podman run --rm akamu:ci-${{ github.sha }} find / -xdev -perm /6000 -type f 2>/dev/null || true)
          if [ -n "$SUID" ]; then
            echo "FAIL: SUID/SGID binaries found:"
            echo "$SUID"
            exit 1
          fi
          echo "PASS: no SUID/SGID binaries"

      - name: Verify read-only rootfs compatibility
        run: |
          podman run --rm --read-only --tmpfs /tmp:size=16M \
            akamu:ci-${{ github.sha }} /app/akamu --version
          echo "PASS: read-only rootfs works"

      - name: Scan server image for CVEs (trivy)
        run: |
          trivy image --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            akamu:ci-${{ github.sha }}

      - name: Scan cosigner image for CVEs (trivy)
        run: |
          trivy image --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            akamu-cosigner:ci-${{ github.sha }}

      - name: Generate SBOM (server)
        run: |
          syft akamu:ci-${{ github.sha }} \
            -o spdx-json=akamu-sbom.spdx.json \
            -o cyclonedx-json=akamu-sbom.cdx.json

      - name: Generate SBOM (cosigner)
        run: |
          syft akamu-cosigner:ci-${{ github.sha }} \
            -o spdx-json=akamu-cosigner-sbom.spdx.json

      - name: Report image sizes
        run: |
          echo "=== Image Sizes ==="
          podman images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" \
            | grep -E '(akamu|cosigner)'

  # ── Workflow lint ───────────────────────────────────────────────────────────
  # Validates .github/workflows/*.yml with actionlint; no Rust toolchain needed.
  lint-workflows:
    name: Lint Workflows
    runs-on: vdali
    timeout-minutes: 5
    container: quay.io/hummingbird/rust:latest-builder
    steps:
      - name: Install build dependencies
        run: |
          if rpm -q $DNF_PACKAGES >/dev/null 2>&1; then
            echo "All required packages already installed"
          else
            dnf install -y $DNF_PACKAGES
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint workflow files
        run: ./contrib/ci/local-ci.sh --no-deps lint-workflows
