# Hardened podman-compose for Akamu ACME CA with MTC cosigners.
#
# Network architecture:
#   akamu-external  – proxy ↔ akamu (the only network reachable from the host)
#   akamu-internal  – akamu ↔ cosigners, akamu ↔ postgres (internal: true)
#
# All services run as non-root with read-only rootfs, dropped capabilities,
# resource limits, and health checks.

services:
  # ── Reverse Proxy (TLS termination) ──────────────────────────────────────────
  proxy:
    build:
      context: .
      dockerfile: contrib/containers/Containerfile.proxy
    ports:
      - "443:8443"
      - "80:8080"
    volumes:
      - ./contrib/containers/configs/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./contrib/containers/configs/tls-certs:/etc/nginx/certs:ro,Z
    networks:
      - akamu-external
    depends_on:
      akamu:
        condition: service_healthy
    # ── Hardening ──
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32M,noexec,nosuid
      - /var/cache/nginx:size=64M,noexec,nosuid
      - /run:size=8M,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ── ACME Server ──────────────────────────────────────────────────────────────
  akamu:
    build:
      context: .
      dockerfile: Containerfile
    volumes:
      - akamu-data:/app/data:Z
      - ./contrib/containers/configs/akamu-server.toml:/app/conf/config.toml:ro,Z
    networks:
      - akamu-external
      - akamu-internal
    depends_on:
      cosigner-a:
        condition: service_healthy
      cosigner-b:
        condition: service_healthy
    # ── Hardening ──
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "/app/akamu", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MTC Cosigner A ──────────────────────────────────────────────────────────
  cosigner-a:
    build:
      context: .
      dockerfile: contrib/containers/Containerfile.cosigner
    volumes:
      - cosigner-a-data:/app/data:Z
      - ./contrib/containers/configs/cosigner-a.toml:/app/conf/cosigner.toml:ro,Z
    networks:
      - akamu-internal
    # ── Hardening ──
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=32M,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "/app/akamu-cosigner", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── MTC Cosigner B ──────────────────────────────────────────────────────────
  cosigner-b:
    build:
      context: .
      dockerfile: contrib/containers/Containerfile.cosigner
    volumes:
      - cosigner-b-data:/app/data:Z
      - ./contrib/containers/configs/cosigner-b.toml:/app/conf/cosigner.toml:ro,Z
    networks:
      - akamu-internal
    # ── Hardening ──
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=32M,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "/app/akamu-cosigner", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── PostgreSQL (production backend) ─────────────────────────────────────────
  # Uncomment for PostgreSQL deployments; default is SQLite (embedded in akamu).
  # postgres:
  #   image: registry.redhat.io/rhel9/postgresql-16:latest
  #   volumes:
  #     - pg-data:/var/lib/pgsql/data:Z
  #   environment:
  #     POSTGRESQL_DATABASE: akamu
  #     POSTGRESQL_USER: akamu
  #     POSTGRESQL_PASSWORD: changeme
  #   networks:
  #     - akamu-internal
  #   user: "26:26"
  #   read_only: true
  #   tmpfs:
  #     - /tmp:size=64M
  #     - /run:size=8M
  #   security_opt:
  #     - no-new-privileges:true
  #   cap_drop:
  #     - ALL
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '2.0'
  #         memory: 1G
  #       reservations:
  #         cpus: '0.25'
  #         memory: 256M
  #   healthcheck:
  #     test: ["CMD", "pg_isready", "-U", "akamu"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  akamu-external:
  akamu-internal:
    internal: true

volumes:
  akamu-data:
  cosigner-a-data:
  cosigner-b-data:
  # pg-data:
