[package]
name = "akamu-policy"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
abac-rs = { version = "0.2", features = ["serde"] }
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob-match = "0.2"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tracing = "0.1"
toml = "0.8"
uuid = { version = "1", features = ["v5"] }
