[package]
name = "akamu-seedgen"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Seed-data generator for Akamu PKI — populates a SQLite database with realistic PKI objects for webui and admin-tool testing"

[[bin]]
name = "akamu-seedgen"
path = "src/main.rs"

[dependencies]
akamu = { path = "../..", features = ["backend-sqlite"] }
akamu-client = { path = "../akamu-client" }
akamu-crdt = { path = "../akamu-crdt" }

axum = { version = "0.8", features = ["http1", "macros"] }
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }

base64 = "0.22"
rand = "0.8"
rand_chacha = "0.3"
uuid = { version = "1", features = ["v4"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

indexmap = "2"

synta-certificate = { workspace = true }
reqwest = { version = "0.12", default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "rustls-native-certs", "ring"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
