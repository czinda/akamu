[package]
name = "akamu-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ACME client CLI with ML-DSA account key support"

[[bin]]
name = "akamu-cli"
path = "src/main.rs"

[dependencies]
akamu-client = { path = "../akamu-client" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
