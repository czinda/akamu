[package]
name = "akamuctl"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "akamu server administration CLI"

[[bin]]
name = "akamuctl"
path = "src/main.rs"

[dependencies]
# TLS and crypto
rustls         = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pki-types = "1"
rustls-native-ossl = "0.1"
rustls-native-certs = "0.8"

# HTTP client — reuse hyper stack already in workspace
hyper          = { version = "1", features = ["client", "http1"] }
hyper-util     = { version = "0.1", features = ["tokio", "client-legacy"] }
hyper-rustls   = { version = "0.27", default-features = false, features = ["http1", "rustls-native-certs", "ring"] }
http-body-util = "0.1"

# Async runtime
tokio          = { version = "1", features = ["full"] }

# Serialization
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
toml           = "0.8"

# Command-line argument parsing
clap           = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive", "env"] }
clap_complete  = "4"

# PEM parsing for cert/key files
synta-certificate = { workspace = true }

# URL encoding for query parameters
percent-encoding = "2"

# DNS resolution for SPN derivation
hickory-resolver = { version = "0.24" }

# GSSAPI / Kerberos (ccache-based login)
akamu-gssapi   = { path = "../akamu-gssapi" }
akamu-client   = { path = "../akamu-client" }
akamu-util     = { path = "../akamu-util" }
base64         = "0.22"
libc           = "0.2"

# Error handling
thiserror      = "2"
