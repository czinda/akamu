[package]
name = "akamuctl"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "akamu server administration CLI"

[[bin]]
name = "akamuctl"
path = "src/main.rs"

[dependencies]
# TLS and crypto
rustls         = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pki-types = "1"
tokio-rustls   = { version = "0.26", default-features = false, features = ["tls12"] }
native-ossl    = "0.1.8"
rustls-native-certs = "0.8"

# HTTP client — reuse hyper stack already in workspace
hyper          = { version = "1", features = ["client", "http1"] }
hyper-util     = { version = "0.1", features = ["tokio", "client-legacy"] }
hyper-rustls   = { version = "0.27", default-features = false, features = ["http1", "rustls-native-certs", "ring"] }
http-body-util = "0.1"

# Async runtime
tokio          = { version = "1", features = ["full"] }

# Serialization
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
toml           = "0.8"

# Command-line argument parsing
clap           = { version = "4", features = ["derive", "env"] }

# PEM parsing for cert/key files
synta-certificate = { version = ">=0.2.0", features = ["std", "pqc"] }

# URL encoding for query parameters
percent-encoding = "2"

# GSSAPI / Kerberos (ccache-based login)
akamu-gssapi   = { path = "../akamu-gssapi" }
base64         = "0.22"
libc           = "0.2"

# Error handling
thiserror      = "2"
