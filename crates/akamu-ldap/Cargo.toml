[package]
name = "akamu-ldap"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Synchronous LDAP client with simple-bind and GSSAPI (Kerberos) authentication"

[dependencies]
libc = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
