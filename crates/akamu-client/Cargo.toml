[package]
name = "akamu-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ACME client library with ML-DSA account key support (draft-ietf-cose-dilithium-11)"

[dependencies]
akamu-jose = { path = "../akamu-jose" }
akamu-gssapi = { path = "../akamu-gssapi" }
synta = { version = ">=0.2.0", default-features = false, features = ["std", "derive"] }
synta-certificate = { version = ">=0.2.0", features = ["std", "pqc"] }

base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tracing = "0.1"
getrandom = "0.2"

hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "rt", "time", "sync", "macros", "process"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-native-ossl = "0.1.8"
