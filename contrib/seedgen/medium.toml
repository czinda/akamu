# akamu-seedgen spec: medium
# 4 CAs  |  ~10 000 certs  |  100 accounts
# CAs: EC P-256, EC P-384, RSA-2048, RSA-4096
# Runtime: 10–20 min

[global]
seed   = 3003
output = "medium.sqlite3"

# ── CAs ───────────────────────────────────────────────────────────────────────

[[ca]]
id               = "ec-p256"
is_default       = true
key_type         = "ec:P-256"
hash_alg         = "sha256"
validity_days    = 90
common_name      = "EC P-256 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

[[ca]]
id               = "ec-p384"
is_default       = false
key_type         = "ec:P-384"
hash_alg         = "sha384"
validity_days    = 180
common_name      = "EC P-384 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

[[ca]]
id               = "rsa-2048"
is_default       = false
key_type         = "rsa:2048"
hash_alg         = "sha256"
validity_days    = 365
common_name      = "RSA-2048 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

[[ca]]
id               = "rsa-4096"
is_default       = false
key_type         = "rsa:4096"
hash_alg         = "sha384"
validity_days    = 730
common_name      = "RSA-4096 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

# ── Cross-signs ───────────────────────────────────────────────────────────────

[[cross_sign]]
issuer         = "ec-p256"
subject        = "ec-p384"
validity_years = 5

[[cross_sign]]
issuer         = "ec-p384"
subject        = "ec-p256"
validity_years = 5

[[cross_sign]]
issuer         = "rsa-2048"
subject        = "rsa-4096"
validity_years = 5

[[cross_sign]]
issuer         = "rsa-4096"
subject        = "rsa-2048"
validity_years = 5

# ── Profiles ──────────────────────────────────────────────────────────────────

[[profile]]
id            = "tls-server"
description   = "Standard TLS server certificate"
eku           = ["server_auth"]
key_usage     = ["digital_signature"]
validity_days = 90

[[profile]]
id                 = "client-auth"
description        = "Client authentication certificate"
eku                = ["client_auth"]
key_usage          = ["digital_signature"]
validity_days      = 365
allowed_key_types  = ["ec:P-256", "ec:P-384", "ed25519"]

[[profile]]
id            = "code-signing"
description   = "Code signing certificate"
eku           = ["code_signing"]
key_usage     = ["digital_signature"]
validity_days = 730

# ── Scenarios ─────────────────────────────────────────────────────────────────
# 4 scenarios × ~2 480 certs each ≈ 10 000 total

[[scenario]]
name         = "ec-p256-tls"
ca_id        = "ec-p256"
profile_id   = "tls-server"
num_accounts = 25

[scenario.certs]
valid          = 1500
revoked        = 375
expired        = 300
near_expiry    = 125
ari_chains     = 40
star_active    = 40
star_canceled  = 20
delegation     = 8
pending_orders = 12
invalid_orders = 12

[scenario.certs.key_types]
"ec:P-256" = 6
"ec:P-384" = 2
"rsa:2048" = 1
"ed25519"  = 1

[scenario.accounts]
deactivated = 2

[[scenario]]
name         = "ec-p384-tls"
