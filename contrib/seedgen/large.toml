# akamu-seedgen spec: large
# 8 CAs  |  ~25 000 certs  |  1 000 accounts
# CAs: EC P-256/384/521, RSA-2048/3072/4096, Ed25519, Ed448
# Runtime: 45–90 min

[global]
seed   = 4004
output = "large.sqlite3"

# ── CAs ───────────────────────────────────────────────────────────────────────

[[ca]]
id               = "ec-p256"
is_default       = true
key_type         = "ec:P-256"
hash_alg         = "sha256"
validity_days    = 90
common_name      = "EC P-256 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

[[ca]]
id               = "ec-p384"
is_default       = false
key_type         = "ec:P-384"
hash_alg         = "sha384"
validity_days    = 180
common_name      = "EC P-384 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

[[ca]]
id               = "ec-p521"
is_default       = false
key_type         = "ec:P-521"
hash_alg         = "sha512"
validity_days    = 180
common_name      = "EC P-521 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

[[ca]]
id               = "rsa-2048"
is_default       = false
key_type         = "rsa:2048"
hash_alg         = "sha256"
validity_days    = 365
common_name      = "RSA-2048 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

[[ca]]
id               = "rsa-3072"
is_default       = false
key_type         = "rsa:3072"
hash_alg         = "sha256"
validity_days    = 365
common_name      = "RSA-3072 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

[[ca]]
id               = "rsa-4096"
is_default       = false
key_type         = "rsa:4096"
hash_alg         = "sha384"
validity_days    = 730
common_name      = "RSA-4096 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

[[ca]]
id               = "ed25519"
is_default       = false
key_type         = "ed25519"
hash_alg         = "sha256"
validity_days    = 90
common_name      = "Ed25519 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

[[ca]]
id               = "ed448"
is_default       = false
key_type         = "ed448"
hash_alg         = "sha512"
validity_days    = 90
common_name      = "Ed448 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

# ── Cross-signs ───────────────────────────────────────────────────────────────

[[cross_sign]]
issuer         = "ec-p256"
subject        = "ec-p384"
validity_years = 5

[[cross_sign]]
issuer         = "ec-p384"
subject        = "ec-p256"
validity_years = 5

[[cross_sign]]
issuer         = "rsa-2048"
subject        = "rsa-4096"
validity_years = 5

[[cross_sign]]
issuer         = "rsa-4096"
subject        = "rsa-2048"
validity_years = 5

[[cross_sign]]
issuer         = "ed25519"
subject        = "ec-p256"
validity_years = 5

[[cross_sign]]
issuer         = "ec-p521"
subject        = "rsa-4096"
validity_years = 5

[[cross_sign]]
issuer         = "rsa-3072"
subject        = "ec-p384"
validity_years = 5

[[cross_sign]]
issuer         = "ed448"
subject        = "rsa-2048"
validity_years = 5

# ── Profiles ──────────────────────────────────────────────────────────────────

[[profile]]
id            = "tls-server"
description   = "Standard TLS server certificate"
eku           = ["server_auth"]
key_usage     = ["digital_signature"]
validity_days = 90

[[profile]]
id                = "client-auth"
description       = "Client authentication certificate"
eku               = ["client_auth"]
key_usage         = ["digital_signature"]
validity_days     = 365
allowed_key_types = ["ec:P-256", "ec:P-384", "ed25519", "ed448"]

[[profile]]
id                = "code-signing"
description       = "Code signing certificate"
eku               = ["code_signing"]
key_usage         = ["digital_signature"]
validity_days     = 730
allowed_key_types = ["ec:P-256", "ec:P-384", "rsa:2048", "rsa:3072", "rsa:4096"]

# ── Scenarios ─────────────────────────────────────────────────────────────────
# 8 scenarios × ~3 100 certs each ≈ 25 000 total

[[scenario]]
name         = "ec-p256-tls"
ca_id        = "ec-p256"
profile_id   = "tls-server"
num_accounts = 125

[scenario.certs]
valid          = 1875
revoked        = 469
