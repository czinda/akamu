# akamu-seedgen spec: xxlarge
# 32 CAs  |  ~50 000 certs  |  10 000 accounts
# CAs: all 16 from xlarge + 16 long/short-validity and hash-variant CAs
# Runtime: 6–12 h

[global]
seed   = 6006
output = "xxlarge.sqlite3"

