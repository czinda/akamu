# ── Profiles ──────────────────────────────────────────────────────────────────

[[profile]]
id            = "tls-server"
description   = "Standard TLS server certificate"
eku           = ["server_auth"]
key_usage     = ["digital_signature"]
validity_days = 90

[[profile]]
id                = "client-auth"
description       = "Client authentication certificate"
eku               = ["client_auth"]
key_usage         = ["digital_signature"]
validity_days     = 365
allowed_key_types = ["ec:P-256", "ec:P-384", "ed25519", "ed448"]

[[profile]]
id                = "code-signing"
description       = "Code signing certificate"
eku               = ["code_signing"]
key_usage         = ["digital_signature"]
validity_days     = 730
allowed_key_types = ["ec:P-256", "ec:P-384", "rsa:2048", "rsa:3072", "rsa:4096"]

[[profile]]
id                = "pqc-tls"
description       = "TLS server certificate with PQC leaf key"
eku               = ["server_auth"]
key_usage         = ["digital_signature"]
validity_days     = 90
allowed_key_types = ["ml-dsa-44", "ml-dsa-65", "ml-dsa-87"]

[[profile]]
id            = "long-tls"
description   = "Long-lived TLS server certificate (365 days)"
eku           = ["server_auth"]
key_usage     = ["digital_signature"]
validity_days = 365

[[profile]]
id            = "ultra-short-tls"
description   = "Ultra-short-lived TLS server certificate (7 days)"
eku           = ["server_auth"]
key_usage     = ["digital_signature"]
validity_days = 7

