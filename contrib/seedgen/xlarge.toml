# akamu-seedgen spec: xlarge
# 16 CAs  |  ~50 000 certs  |  10 000 accounts
# CAs: EC P-256/384/521, RSA-2048/3072/4096, Ed25519, Ed448,
#       ML-DSA-44/65/87, + SHA-384/512 variants of EC and RSA
# Runtime: 3–6 h

[global]
seed   = 5005
output = "xlarge.sqlite3"

# ── CAs ───────────────────────────────────────────────────────────────────────

[[ca]]
id               = "ec-p256"
is_default       = true
key_type         = "ec:P-256"
hash_alg         = "sha256"
validity_days    = 90
common_name      = "EC P-256 Test CA"
organization     = "Akamu Test PKI"
ca_validity_years = 10

