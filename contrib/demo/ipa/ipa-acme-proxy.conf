# Akamu ACME server proxy configuration for FreeIPA co-deployment.
# Drop into /etc/httpd/conf.d/ on the IPA server and reload httpd.
#
# Prerequisites:
#   - mod_proxy and mod_proxy_http loaded (standard on Fedora/RHEL)
#   - akamu running with: listen_addr = "unix:/run/akamu/akamu.sock"
#   - akamu.toml: base_url = "https://<ipa-fqdn>/acme"
#   - apache user in the akamu group: usermod -aG akamu apache

# Strip the /acme prefix and forward to akamu's Unix socket.
# nocanon: suppress Apache URL normalisation before forwarding.
ProxyPass        /acme/  unix:/run/akamu/akamu.sock|http://localhost/  nocanon
ProxyPassReverse /acme/  http://localhost/

# Rewrite cookie Path from "/" to "/acme/" so akamu's session cookie
# does not bleed into the /ipa namespace.
ProxyPassReverseCookiePath / /acme/

# Pass the real Host header so akamu builds correct redirect URIs.
ProxyPreserveHost On

# Redirect the bare /acme (no trailing slash) → /acme/
RedirectMatch permanent ^/acme$ /acme/

<Location "/acme/">
    # Akamu handles its own Kerberos SPNEGO authentication.
    # No Apache-level authentication is applied here.
    AuthType None
    Require all granted

    SSLOptions +StdEnvVars +ExportCertData +StrictRequire
    SSLVerifyClient none

    # Tell akamu it is behind HTTPS so it generates https:// URIs in
    # ACME responses and sets the Secure flag on cookies.
    RequestHeader set X-Forwarded-Proto "https"

    # Security headers.
    Header always set    X-Content-Type-Options "nosniff"
    Header always append X-Frame-Options "DENY"
    Header always append Content-Security-Policy "frame-ancestors 'none'"
</Location>

# Optionally restrict the admin API to a management network.
#<Location "/acme/admin">
#    Require ip 127.0.0.0/8 192.168.0.0/24
#</Location>

# HTTP → HTTPS redirect for /acme/ — mirrors what ipa-rewrite.conf does for /ipa/.
# RewriteEngine is already on (enabled by ipa-rewrite.conf).
RewriteCond %{SERVER_PORT} !^443$
RewriteRule ^/acme/(.*)     https://%{HTTP_HOST}/acme/$1 [L,R=307,NC]
