# gssproxy service entry for the akamu ACME server.
# Install as /etc/gssproxy/20-akamu.conf and restart gssproxy.
#
# Akamu shares the IPA HTTP service keytab (/var/lib/ipa/gssproxy/http.keytab)
# already managed by IPA.  No separate keytab extraction is needed.
#
# allow_protocol_transition — S4U2Self: akamu can obtain a service ticket on
#   behalf of an authenticated client for constrained-delegation LDAP binds.
# allow_constrained_delegation — S4U2Proxy: forward those credentials to the
#   IPA LDAP service (needed when fetching IPAThinCA profiles via GSSAPI LDAP).
#
# cred_usage = both:
#   accept  — akamu's SPNEGO acceptor verifies Kerberos tickets from ACME
#             clients and admin operators.
#   initiate — required for S4U2Self impersonation and LDAP profile fetches.
#
# client_keytab — allows gssproxy to acquire a TGT for the HTTP service
#   principal itself; required before S4U2Self can impersonate a user.

[service/akamu]
  mechs = krb5
  cred_store = keytab:/var/lib/ipa/gssproxy/http.keytab
  cred_store = client_keytab:/var/lib/ipa/gssproxy/http.keytab
  allow_protocol_transition = true
  allow_constrained_delegation = true
  cred_usage = both
  euid = akamu
