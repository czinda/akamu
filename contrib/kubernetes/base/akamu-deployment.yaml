apiVersion: apps/v1
kind: Deployment
metadata:
  name: akamu
  namespace: akamu
  labels:
    app.kubernetes.io/name: akamu
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: akamu
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akamu
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: akamu
          image: quay.io/akamu/akamu:latest
          ports:
            - name: acme
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: "2"
              memory: "512Mi"
              ephemeral-storage: "128Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /acme/directory
              port: acme
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /acme/directory
              port: acme
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: akamu-data
        - name: config
          configMap:
            name: akamu-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: akamu-data
  namespace: akamu
  labels:
    app.kubernetes.io/name: akamu
    app.kubernetes.io/component: server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
