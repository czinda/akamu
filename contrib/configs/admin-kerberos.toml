# admin-kerberos.toml — Admin API secured with Kerberos/GSSAPI authentication.
#
# Use in Kerberos environments where operators already have Kerberos tickets
# and prefer not to manage separate operator TLS certificates.  On first run
# the bootstrap principal is registered as an Administrator automatically.

listen_addr = "0.0.0.0:8080"
base_url    = "https://acme.example.com"

[database]
url = "sqlite:///var/lib/akamu/acme.db"

[ca]
key_file  = "/etc/akamu/certs/ca.key.pem"
cert_file = "/etc/akamu/certs/ca.cert.pem"

[admin]
listen_addr = "127.0.0.1:9443"
cert_file   = "/etc/akamu/admin-tls.pem"
key_file    = "/etc/akamu/admin-tls-key.pem"
# Bootstrap: first operator registered is the Kerberos principal below.
bootstrap_operator_name             = "admin"
bootstrap_operator_gssapi_principal = "admin@EXAMPLE.COM"

[admin.gssapi]
# Keytab for the admin HTTP service principal.
keytab_file  = "/etc/akamu/admin-http.keytab"
service_name = "HTTP"
