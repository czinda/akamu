# post-quantum.toml — Post-quantum CA key and ML-DSA certificate profiles.
#
# Use to future-proof your PKI against quantum computing attacks.  Akāmu
# supports ML-DSA (FIPS 204, formerly Dilithium) for the CA key, issued
# certificate keys, and account keys.  ML-DSA-65 offers a good balance of
# security and performance; ML-DSA-87 provides the highest security level.
# Note: not all TLS clients support ML-DSA yet; consider hybrid deployments.

listen_addr = "0.0.0.0:8080"
base_url    = "https://acme.example.com"

[database]
url = "sqlite:///var/lib/akamu/acme.db"

[ca]
key_file  = "/etc/akamu/certs/ca.key.pem"
cert_file = "/etc/akamu/certs/ca.cert.pem"
# ML-DSA-65 CA key (NIST security level 3 — roughly equivalent to AES-192).
# Other options: "ml-dsa-44" (level 2) or "ml-dsa-87" (level 5).
key_type = "ml-dsa-65"
# ML-DSA uses SHA-512 internally; sha512 is the recommended hash_alg.
hash_alg = "sha512"

[profiles]
refresh_interval_secs = 3600

[profiles.providers.local]
type = "builtin"

[profiles.providers.local.profiles.pq-tlsserver]
description       = "Post-quantum TLS server certificate (ML-DSA keys only)"
validity_days     = 90
key_usage         = ["digital_signature"]
eku               = ["server_auth"]
# Restrict CSR keys to ML-DSA algorithms; remove to also allow classical keys.
allowed_key_types = ["ml-dsa-44", "ml-dsa-65", "ml-dsa-87"]
