# Hardened nginx reverse proxy for Akamu ACME CA.
# Terminates TLS, enforces security headers, and proxies to the akamu backend.

worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Hardening ─────────────────────────────────────────────────────────────
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 65s;

    # Mitigate slowloris-style attacks.
    limit_req_zone $binary_remote_addr zone=acme:10m rate=30r/s;

    # ── HTTPS server (TLS termination) ────────────────────────────────────────
    server {
        listen 8443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.pem;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS 1.3 only — no legacy protocol support.
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # OCSP stapling.
        ssl_stapling on;
        ssl_stapling_verify on;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-XSS-Protection "0" always;

        # ── ACME endpoints ────────────────────────────────────────────────────
        location / {
            limit_req zone=acme burst=50 nodelay;

            proxy_pass http://akamu:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;

            proxy_buffering off;
        }

        # Block access to admin API from external network.
        location /admin/ {
            return 403;
        }
    }

    # ── HTTP redirect ─────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # ACME http-01 challenge pass-through (clients validate over HTTP).
        location /.well-known/acme-challenge/ {
            proxy_pass http://akamu:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Everything else redirects to HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
