# journald configuration for the akamu audit namespace.
#
# Install to: /etc/systemd/journald@akamu.conf
# Activates: systemd-journald@akamu.service
#
# Journal data is stored in /var/log/journal/<machine-id>.akamu/
# Query with:  journalctl --namespace=akamu
# Audit only:  journalctl --namespace=akamu SYSLOG_IDENTIFIER=akamu-audit
# By type:     journalctl --namespace=akamu AKAMU_EVENT_TYPE=cert.issue
# Failures:    journalctl --namespace=akamu AKAMU_OUTCOME=failure

[Journal]
# Persistent storage (survives reboots).
Storage=persistent

# Maximum disk usage for the akamu namespace journal.
SystemMaxUse=500M

# Maximum age of journal entries before rotation.
MaxRetentionSec=1year

# Compress journal files.
Compress=yes
