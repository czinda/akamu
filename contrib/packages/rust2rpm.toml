[package]
url = "https://codeberg.org/abbra/akamu/archive/v{version}.tar.gz"

summary = "ACME server with post-quantum certificate support"

description = """
akamu is an ACME (RFC 8555) certificate authority server that supports
post-quantum cryptography via native OpenSSL 3.2+ APIs (ML-DSA requires
OpenSSL 3.5+).  It implements the full ACME protocol including http-01,
dns-01, tls-alpn-01, dns-persist-01, and onion-csr-01 (RFC 9799) challenge
types, and supports Merkle Tree Certificates (MTC) for compressed certificate
delivery.

This SRPM produces four binary packages from the workspace:
  akamu          — the main ACME CA server daemon
  akamuctl       — the admin CLI
  akamu-cosigner — the MTC cosigner daemon (POST /sign endpoint)
  akamu-client   — the command-line ACME client (akamu-cli binary)

Systemd service units for akamu and akamu-cosigner are installed from
contrib/systemd/ in the source tree.
"""

# Install the server binary; the library is internal.
# akamu-cosigner and akamu-client binaries are added via explicit
# %cargo_install calls in the custom sections of the spec.
cargo-install-bin = true
cargo-install-lib = false

[requires]
build = [
    "openssl-devel",
    "sqlite-devel",
    "clang-devel",
    "pkgconfig(libsqlite3)",
    # LDAP / SASL / GSSAPI (akamu-ldap FFI crate)
    "openldap-devel",
    "cyrus-sasl-devel",
    "krb5-devel",
]

[tests]
skip = ["doc"]
comments = [
    "Documentation tests require external infrastructure (live ACME endpoints,",
    "DNS resolver, TLS server) not available inside the mock build environment.",
]
