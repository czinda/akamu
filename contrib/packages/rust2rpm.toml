[package]
# Source tarball produced with:
#   git archive --format=tar.gz --prefix=akamu-{version}/ HEAD \
#       -o akamu-{version}.tar.gz
# Until the crate is published to crates.io, use the Codeberg forge URL:
url = "https://codeberg.org/abbra/akamu/archive/v{version}.tar.gz"

summary = "ACME server with post-quantum certificate support"

description = """
akamu is an ACME (RFC 8555) certificate authority server that supports
post-quantum cryptography via an ML-DSA/PQC-capable OpenSSL fork.  It
implements the full ACME protocol including http-01, dns-01, and tls-alpn-01
challenge types, and supports Merkle Tree Certificates (MTC) for
compressed certificate delivery.

This SRPM produces three binary packages from the workspace:
  akamu          — the main ACME CA server daemon
  akamu-cosigner — the MTC cosigner daemon (POST /sign endpoint)
  akamu-client   — the command-line ACME client (akamu-cli binary)

Systemd service units for akamu and akamu-cosigner are installed from
contrib/systemd/ in the source tree.
"""

license = "GPL-3.0-or-later"

# The workspace root has both src/lib.rs (server library) and src/main.rs
# (server binary).  Install only the server binary; the library is internal.
# The akamu-cosigner and akamu-client binaries are installed via explicit
# %cargo_install calls in the spec %install section (see rust-akamu.spec.in).
install_bin = true
install_lib = false

[requires]
build = [
    "openssl-devel",
    "sqlite-devel",
    "clang-devel",
    "pkgconfig(libsqlite3)",
]
comments = [
    "Rebuild this package whenever openssl-devel is updated in Fedora.",
    "The project uses an OpenSSL fork (pqc-prs) for ML-DSA/PQ support;",
    "verify compatibility when the system OpenSSL major version changes.",
    "",
    "A full vendor tarball (Source1) is required because:",
    "  1. [patch.crates-io] in Cargo.toml overrides openssl and openssl-sys",
    "     with a git fork (pqc-prs branch of",
    "     https://github.com/abbra/rust-openssl.git) for ML-DSA/ML-KEM/PQC",
    "     support.  This fork is not published to crates.io.",
    "  2. tokio-rusqlite and rusqlite_migration are not yet packaged in Fedora.",
    "  3. rusqlite 0.31 is required; Fedora ships 0.38 (incompatible API).",
    "  4. hickory-resolver 0.24 is required; Fedora ships 0.25 (incompatible).",
    "  5. toml 0.8 is required; Fedora ships 1.1 (incompatible).",
    "Generate the vendor tarball with:",
    "  cargo vendor --versioned-dirs vendor/",
    "  tar czf akamu-{version}-vendor.tar.gz -C vendor --transform ...",
    "",
    "PREREQUISITE: the synta* crates must be installed into the mock chroot",
    "before this SRPM can build:",
    "  rust-synta-devel, rust-synta-certificate-devel,",
    "  rust-synta-x509-verification-devel, rust-synta-mtc-devel",
    "Run 'mock --install' for each in dependency order before 'mock --rebuild'.",
]

[tests]
skip = ["doc"]
comments = [
    "Documentation tests require external infrastructure (live ACME endpoints,",
    "DNS resolver, TLS server) not available inside the mock build environment.",
]
