[workspace]
members = [".", "crates/akamu-jose", "crates/akamu-client", "crates/akamu-cli"]
resolver = "2"

[package]
name = "akamu"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = ["backend-sqlite"]
backend-sqlite   = ["sqlx/sqlite"]
backend-postgres = ["sqlx/postgres"]
backend-mariadb  = ["sqlx/mysql"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["http1", "http2"] }
tower-http = { version = "0.6", features = ["trace"] }

# Database (sqlx with runtime-dispatch Any backend; concrete drivers enabled via features)
sqlx = { version = "0.8", default-features = false, features = ["any", "runtime-tokio", "migrate", "derive", "tls-native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
toml = "0.8"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Base64url (JWS encoding — no padding)
base64 = "0.22"

# DNS resolution for dns-01 challenge validation
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }

# TLS client for tls-alpn-01 challenge validation
# TLS 1.2 enabled for compatibility with applicant servers not yet on TLS 1.3
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"

# HTTP client for http-01 challenge validation (hyper is already pulled by axum)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "server-auto", "service"] }
http-body-util = "0.1"

# Service utilities (tower::ServiceExt used in TLS accept loop)
tower = { version = "0.5", features = ["util"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptographically random nonces/tokens
getrandom = "0.2"

# JWK/JWS primitives (extracted from server; no axum/rusqlite dependency)
akamu-jose = { path = "crates/akamu-jose" }

# OpenSSL bindings (pqc-prs fork for ML-DSA / composite PQ support)
openssl = "0.10"

# Base ASN.1 library (needed for Decoder/Encoder and Integer type)
synta = { version = "0.1.6", default-features = false, features = ["std", "derive"] }

# Synta crates for all X.509 / MTC operations
synta-certificate =  { version = "0.1.6", features = ["std", "openssl", "pqc"] }
synta-x509-verification =  { version = "0.1.6" }
synta-mtc = { version = "0.1.6", features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
# (instant-acme 0.4 removed: it pulled hyper 0.14 as a transitive dependency,
# which is not available in RHEL 10 / EPEL 10.  The acme_client_compat
# integration test that used it has been removed along with this dependency.)
# CLI argument parsing for the acme-bench standalone benchmark binary.
clap = { version = "4", features = ["derive"] }

[[bench]]
name = "acme_bench"
harness = false

[patch.crates-io]
# Use the same rust-openssl fork as synta-certificate so that both crates see
# consistent OpenSSL bindings (including ML-DSA / ML-KEM / PQC support).
openssl-sys = { git = "https://github.com/abbra/rust-openssl.git", branch = "pqc-prs" }
openssl     = { git = "https://github.com/abbra/rust-openssl.git", branch = "pqc-prs" }
# Use the local synta worktree (branch pkcs11-uri-support) that includes
# BackendPrivateKey::from_pkcs11_uri and PKCS#11 URI key loading support.
synta             = { path = "/var/home/abokovoy/workspace/synta-pkcs11" }
synta-certificate = { path = "/var/home/abokovoy/workspace/synta-pkcs11/synta-certificate" }
