[workspace]
members = [".", "crates/akamu-jose", "crates/akamu-client", "crates/akamu-cli", "crates/akamu-cosigner", "crates/akamu-ldap", "crates/akamu-gssapi", "crates/akamuctl", "crates/akamu-seedgen", "crates/akamu-crdt"]
resolver = "2"

[package]
name = "akamu"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = ["backend-sqlite"]
backend-sqlite   = ["sqlx/sqlite"]
backend-postgres = ["sqlx/postgres"]
backend-mariadb  = ["sqlx/mysql"]
# Expose test-only helpers (e.g. build_cosigner_client_http) to integration tests.
# Pass --features test-utils when running `cargo test`.
test-utils = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["http1", "http2", "macros"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }

# GSSAPI / SPNEGO server-side authentication
akamu-gssapi = { path = "crates/akamu-gssapi" }

# IP network / CIDR matching (for trusted_proxies)
ipnet = { version = "2", features = ["serde"] }

# Systemd socket activation (TCP or Unix)
listenfd = "1"

# Database (sqlx with runtime-dispatch Any backend; concrete drivers enabled via features)
sqlx = { version = "0.8", default-features = false, features = ["any", "runtime-tokio", "migrate", "macros", "derive", "tls-native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# Configuration
toml = "0.8"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Base64url (JWS encoding — no padding)
base64 = "0.22"

# DNS resolution for dns-01 challenge validation
# dnssec-ring enables actual DNSSEC validation; without it ResolverOpts::validate
# is compiled in but silently has no effect (opts.validate = true is a no-op).
hickory-resolver = { version = "0.24", features = ["dnssec-openssl", "dns-over-native-tls"] }

# TLS client for tls-alpn-01 challenge validation
# TLS 1.2 enabled for compatibility with applicant servers not yet on TLS 1.3
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-pki-types = "1"
rustls-native-ossl = "0.1"

# HTTP client for http-01 challenge validation (hyper is already pulled by axum)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "server-auto", "service"] }
http-body-util = "0.1"

# HTTPS connector for MTC cosigner requests; build HTTPS clients that respect
# the OS root CA store and per-cosigner custom CA certificates.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "rustls-native-certs", "ring"] }
rustls-native-certs = "0.8"

# Service utilities (tower::ServiceExt used in TLS accept loop)
tower = { version = "0.5", features = ["util"] }

# Percent-encoding for http+unix:// JWKS URL socket path decoding
percent-encoding = "2"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptographically random nonces/tokens
getrandom = "0.2"

# Constant-time byte comparison (session token lookup defense against timing attacks)
subtle = "2"

# Secure memory wiping on drop (FDP_RIP.1 — residual information protection)
zeroize = { version = "1", features = ["zeroize_derive"] }

# Regular expressions (profile identifier authorization)
regex = { version = "1", default-features = false, features = ["std", "unicode-bool"] }

# Ordered hash map (stable-insertion-order HashMap) for multi-CA registry
indexmap = "2"
# POSIX file locking (flock) for MTC log exclusion
libc = "0.2"

# JWK/JWS primitives (extracted from server; no axum/rusqlite dependency)
akamu-jose = { path = "crates/akamu-jose" }

# CRDT primitives for cluster state replication
akamu-crdt = { path = "crates/akamu-crdt", features = ["db"] }

# ACME client library (used by the IdO→CA upstream delegation flow, Step 13)
akamu-client = { path = "crates/akamu-client" }

# LDAP client (OpenLDAP FFI with simple-bind and GSSAPI/Kerberos support)
akamu-ldap = { path = "crates/akamu-ldap" }

# Base ASN.1 library (needed for Decoder/Encoder and Integer type)
synta = { version = ">=0.2.4", default-features = false, features = ["std", "derive"] }

# Synta crates for all X.509 / MTC operations
# >=0.2.4: CosignerID redesigned as TrustAnchorID OID, MtcProof gains extensions field
# (draft-ietf-plants-merkle-tree-certs-04).
synta-certificate =  { version = ">=0.2.4", features = ["std", "pqc"] }
synta-x509-verification =  { version = ">=0.2.4" }
synta-mtc = { version = ">=0.2.4", features = ["std"] }

# Native Rust bindings to system OpenSSL (composite ML-DSA TLS verify)
native-ossl = "0.1"

# zstd compression for gossip CRDT payloads
zstd = "0.13"

# HTTP client for outbound gossip pushes (plain HTTP; CMS provides auth+confidentiality)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
akamu-client = { path = "crates/akamu-client" }
# (instant-acme 0.4 removed: it pulled hyper 0.14 as a transitive dependency,
# which is not available in RHEL 10 / EPEL 10.  The acme_client_compat
# integration test that used it has been removed along with this dependency.)
# CLI argument parsing for the acme-bench standalone benchmark binary.
clap = { version = "4", features = ["derive"] }
# Native Rust OpenSSL bindings — used by gossip_bootstrap integration test
# to generate ML-KEM-768 and ECDSA P-256 node keys without the full server binary.
native-ossl = "0.1"

[[bench]]
name = "acme_bench"
harness = false

[[test]]
name = "mtc_cosigner_flow"
required-features = ["test-utils"]


